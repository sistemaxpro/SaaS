name: SistemaXAssist
options:
  bundleIdPrefix: pro.sistemax
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.7.0
targets:
  SistemaXAssist:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SistemaXAssist
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: pro.sistemax.assist.ios
      PRODUCT_NAME: SistemaX Assist
      SWIFT_VERSION: 5.0
      CODE_SIGN_ENTITLEMENTS: SistemaXAssist/Resources/SistemaXAssist.entitlements
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 0.1.0
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_NSUserTrackingUsageDescription: SistemaX Assist usa notificaciones para avisar autorizaciones pendientes.
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: true
      INFOPLIST_KEY_CFBundleDisplayName: SistemaX Assist
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
      GENERATE_INFOPLIST_FILE: true
      DEVELOPMENT_TEAM: ""
