<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB84D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C1272D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="120" height="120" rx="28" ry="28" fill="url(#grad1)"/>

  <!-- Wrench principal -->
  <g transform="translate(35, 30)">
    <!-- Mango de llave -->
    <rect x="8" y="2" width="8" height="48" rx="4" fill="#FFF" opacity="0.9"/>

    <!-- Cabeza de llave -->
    <rect x="2" y="38" width="20" height="14" rx="3" fill="#FFF" opacity="0.95"/>
    <circle cx="12" cy="45" r="3" fill="#FF6B35" opacity="0.8"/>
  </g>

  <!-- Engrane/tuerca (herramienta) -->
  <g transform="translate(50, 50)">
    <circle cx="0" cy="0" r="18" fill="url(#grad2)" opacity="0.9"/>

    <!-- Dientes del engrane -->
    <g stroke="#FFF" stroke-width="2" fill="none" opacity="0.8">
      <line x1="0" y1="-20" x2="0" y2="-24"/>
      <line x1="14" y1="-14" x2="17" y2="-17"/>
      <line x1="20" y1="0" x2="24" y2="0"/>
      <line x1="14" y1="14" x2="17" y2="17"/>
      <line x1="0" y1="20" x2="0" y2="24"/>
      <line x1="-14" y1="14" x2="-17" y2="17"/>
      <line x1="-20" y1="0" x2="-24" y2="0"/>
      <line x1="-14" y1="-14" x2="-17" y2="-17"/>
    </g>

    <!-- Centro -->
    <circle cx="0" cy="0" r="6" fill="#FFF" opacity="0.95"/>
  </g>

  <!-- Símbolo de advertencia/alerta pequeño -->
  <g transform="translate(20, 70)">
    <path d="M 10 0 L 20 15 L 0 15 Z" fill="#FFF" opacity="0.85"/>
    <circle cx="10" cy="10" r="1.5" fill="#FF6B35"/>
  </g>
</svg>