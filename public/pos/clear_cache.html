<!doctype html>
<html>
  <head>
    <title>Limpiar Caché POS</title>
    <style>
      body {
        font-family: monospace;
        padding: 40px;
        background: #1a1a1a;
        color: #0f0;
      }
      button {
        background: #0a0;
        color: #000;
        border: none;
        padding: 20px 40px;
        font-size: 18px;
        cursor: pointer;
        margin: 10px;
        font-weight: bold;
      }
      button:hover {
        background: #0f0;
      }
      .result {
        margin-top: 20px;
        padding: 20px;
        background: #2a2a2a;
        border-left: 4px solid #0f0;
      }
    </style>
  </head>
  <body>
    <h1>🧹 Limpieza de Caché POS</h1>
    <p>
      Esta herramienta limpiará TODOS los datos guardados del POS en tu
      navegador.
    </p>

    <button onclick="limpiarTodo()">🗑️ LIMPIAR TODO</button>
    <button onclick="verDatos()">👁️ VER DATOS ACTUALES</button>

    <div id="resultado" class="result" style="display: none"></div>

    <script>
      function limpiarTodo() {
        const keys = Object.keys(localStorage);
        const posKeys = keys.filter(
          (k) =>
            k.includes("pos_") ||
            k.includes("id_empresa") ||
            k.includes("id_login"),
        );

        let resultado = `<h3>✅ Limpieza Completada</h3>`;
        resultado += `<p>Se eliminaron ${posKeys.length} items:</p><ul>`;

        posKeys.forEach((key) => {
          resultado += `<li>❌ ${key}</li>`;
          localStorage.removeItem(key);
        });

        resultado += `</ul>`;
        resultado += `<p><strong>🔄 Recarga la página del POS: <a href="/pos/" style="color:#0f0;">https://sistemax.com.py/pos/</a></strong></p>`;

        document.getElementById("resultado").innerHTML = resultado;
        document.getElementById("resultado").style.display = "block";
      }

      function verDatos() {
        const keys = Object.keys(localStorage);
        const posKeys = keys.filter(
          (k) =>
            k.includes("pos_") ||
            k.includes("id_empresa") ||
            k.includes("id_login"),
        );

        let resultado = `<h3>📋 Datos Actuales en localStorage</h3>`;
        resultado += `<ul>`;

        posKeys.forEach((key) => {
          let value = localStorage.getItem(key);
          if (value.length > 200)
            value = value.substring(0, 200) + "... (truncado)";
          resultado += `<li><strong>${key}:</strong> ${value}</li>`;
        });

        if (posKeys.length === 0) {
          resultado += `<li>✅ No hay datos del POS guardados</li>`;
        }

        resultado += `</ul>`;

        document.getElementById("resultado").innerHTML = resultado;
        document.getElementById("resultado").style.display = "block";
      }
    </script>
  </body>
</html>
