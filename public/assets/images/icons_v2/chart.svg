<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar1G" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bar2G" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bar3G" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0005"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Grid lines (subtle) -->
  <line x1="11" y1="48" x2="53" y2="48" stroke="white" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="11" y1="38" x2="53" y2="38" stroke="white" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="11" y1="28" x2="53" y2="28" stroke="white" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="11" y1="18" x2="53" y2="18" stroke="white" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Axes -->
  <line x1="11" y1="50" x2="53" y2="50" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="11" y1="50" x2="11" y2="14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Bars -->
  <rect x="15" y="30" width="10" height="20" rx="3" fill="url(#bar1G)" filter="url(#sh)"/>
  <!-- Bar shine -->
  <rect x="16" y="31" width="4" height="6" rx="2" fill="white" fill-opacity="0.25"/>

  <rect x="29" y="18" width="10" height="32" rx="3" fill="url(#bar2G)" filter="url(#sh)"/>
  <rect x="30" y="19" width="4" height="8" rx="2" fill="white" fill-opacity="0.25"/>

  <rect x="43" y="36" width="10" height="14" rx="3" fill="url(#bar3G)" filter="url(#sh)"/>
  <rect x="44" y="37" width="4" height="5" rx="2" fill="white" fill-opacity="0.25"/>

  <!-- Trend line over bars -->
  <polyline points="20,28 34,16 48,34" fill="none" stroke="white" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,2" stroke-opacity="0.55"/>
  <circle cx="20" cy="28" r="2" fill="white" filter="url(#glow)"/>
  <circle cx="34" cy="16" r="2" fill="white" filter="url(#glow)"/>
  <circle cx="48" cy="34" r="2" fill="white" filter="url(#glow)"/>
</svg>
