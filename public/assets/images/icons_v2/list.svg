<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="clipG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="paperG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="check1G" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0005"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Clipboard body -->
  <rect x="12" y="14" width="40" height="44" rx="4" fill="url(#paperG)" filter="url(#sh)"/>
  <!-- Paper shine -->
  <rect x="12" y="14" width="40" height="11" rx="4" fill="white" fill-opacity="0.4"/>

  <!-- Clipboard clip -->
  <rect x="23" y="9" width="18" height="11" rx="3" fill="url(#clipG)" filter="url(#shSm)"/>
  <rect x="26" y="7" width="12" height="6" rx="3" fill="url(#clipG)"/>
  <!-- Clip spring -->
  <rect x="28.5" y="12" width="7" height="3.5" rx="1.75" fill="#94a3b8"/>

  <!-- List row 1 - checked (green) -->
  <rect x="17" y="27" width="5" height="5" rx="1.5" fill="url(#check1G)" filter="url(#shSm)"/>
  <polyline points="18.2,29.5 19.5,31 21.8,27.8" fill="none" stroke="white" stroke-width="1.3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="26" y1="29.5" x2="44" y2="29.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- List row 2 - checked -->
  <rect x="17" y="34" width="5" height="5" rx="1.5" fill="url(#check1G)" filter="url(#shSm)"/>
  <polyline points="18.2,36.5 19.5,38 21.8,34.8" fill="none" stroke="white" stroke-width="1.3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="26" y1="36.5" x2="44" y2="36.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- List row 3 - unchecked -->
  <rect x="17" y="41" width="5" height="5" rx="1.5" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="26" y1="43.5" x2="36" y2="43.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- List row 4 - unchecked -->
  <rect x="17" y="48" width="5" height="5" rx="1.5" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="26" y1="50.5" x2="40" y2="50.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="18" ry="2" fill="#0003"/>
</svg>
