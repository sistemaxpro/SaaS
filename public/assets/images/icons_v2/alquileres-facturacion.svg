<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="afc-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="afc-doc" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f0fdfa"/><stop offset="100%" stop-color="#ccfbf1"/></linearGradient>
    <linearGradient id="afc-house" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="afc-coin" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="afc-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.28"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="afc-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="afc-sm"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0003"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#afc-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#afc-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#afc-gl)"/>

  <!-- Invoice paper -->
  <rect x="10" y="7" width="36" height="50" rx="3" fill="url(#afc-doc)" filter="url(#afc-sh)"/>

  <!-- Header band with house -->
  <rect x="10" y="7" width="36" height="15" rx="3" fill="#14b8a6" fill-opacity="0.25"/>
  <!-- Mini house centered in header -->
  <polygon points="21,21 28,13 35,21" fill="url(#afc-house)" filter="url(#afc-sm)"/>
  <rect x="22" y="21" width="12" height="8" rx="1" fill="#99f6e4"/>
  <rect x="26" y="24" width="4" height="5" rx="1" fill="#14b8a6" fill-opacity="0.6"/>
  <rect x="23" y="22" width="3" height="2.5" rx="0.5" fill="#2dd4bf" fill-opacity="0.9"/>
  <rect x="30" y="22" width="3" height="2.5" rx="0.5" fill="#2dd4bf" fill-opacity="0.9"/>
  <!-- FACTURA label -->
  <text x="28" y="11" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.5" font-weight="700" fill="#065f46" fill-opacity="0.7">ALQUILER</text>

  <!-- Line items -->
  <line x1="14" y1="28" x2="42" y2="28" stroke="#14b8a6" stroke-width="0.8" stroke-opacity="0.4"/>
  <rect x="14" y="30" width="18" height="2.5" rx="1" fill="#5eead4" fill-opacity="0.7"/>
  <rect x="35" y="30" width="7" height="2.5" rx="1" fill="#5eead4" fill-opacity="0.7"/>
  <rect x="14" y="35" width="15" height="2.5" rx="1" fill="#5eead4" fill-opacity="0.7"/>
  <rect x="35" y="35" width="7" height="2.5" rx="1" fill="#5eead4" fill-opacity="0.7"/>
  <rect x="14" y="40" width="20" height="2.5" rx="1" fill="#5eead4" fill-opacity="0.7"/>
  <rect x="35" y="40" width="7" height="2.5" rx="1" fill="#5eead4" fill-opacity="0.7"/>

  <!-- Total -->
  <line x1="14" y1="46" x2="46" y2="46" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="14" y="51" font-family="Arial,sans-serif" font-size="5" font-weight="700" fill="#065f46">TOTAL</text>
  <text x="46" y="51" text-anchor="end" font-family="monospace" font-size="5.5" font-weight="700" fill="#065f46">$850</text>

  <!-- Coin badge -->
  <circle cx="48" cy="51" r="10" fill="url(#afc-coin)" filter="url(#afc-sm)"/>
  <circle cx="48" cy="51" r="7.5" fill="none" stroke="#92400e" stroke-width="1" stroke-opacity="0.3"/>
  <text x="48" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="900" fill="white">$</text>

  <!-- Paper shine -->
  <rect x="10" y="7" width="36" height="8" rx="3" fill="white" fill-opacity="0.25"/>
</svg>
