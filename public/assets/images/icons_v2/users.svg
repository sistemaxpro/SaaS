<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="us-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="us-fig" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ede9fe"/><stop offset="100%" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="us-fig2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="us-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="us-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="us-sm"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0004"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#us-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#us-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#us-gl)"/>
  <!-- Back person (right, slightly behind) -->
  <circle cx="40" cy="22" r="9" fill="url(#us-fig2)" filter="url(#us-sm)"/>
  <path d="M24 56 C24 43 56 43 56 56" fill="url(#us-fig2)" filter="url(#us-sm)"/>
  <!-- Front person (left, in front) -->
  <circle cx="25" cy="24" r="10" fill="url(#us-fig)" filter="url(#us-sh)"/>
  <path d="M7 57 C7 42 43 42 43 57" fill="url(#us-fig)" filter="url(#us-sh)"/>
  <!-- Face details front -->
  <circle cx="22" cy="22" r="1.5" fill="#7c3aed" fill-opacity="0.6"/>
  <circle cx="28" cy="22" r="1.5" fill="#7c3aed" fill-opacity="0.6"/>
  <path d="M22 27 Q25 30 28 27" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Face details back -->
  <circle cx="37" cy="20" r="1.2" fill="#5b21b6" fill-opacity="0.5"/>
  <circle cx="43" cy="20" r="1.2" fill="#5b21b6" fill-opacity="0.5"/>
</svg>
