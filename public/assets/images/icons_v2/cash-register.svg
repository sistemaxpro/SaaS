<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f5ee"/>
      <stop offset="100%" stop-color="#c2e0cc"/>
    </linearGradient>
    <linearGradient id="drawerG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1f0db"/>
      <stop offset="100%" stop-color="#a7d9b7"/>
    </linearGradient>
    <linearGradient id="screenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2b18"/>
      <stop offset="100%" stop-color="#061409"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0004"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Receipt paper top -->
  <rect x="20" y="7" width="16" height="7" rx="1" fill="white" fill-opacity="0.8"/>
  <line x1="23" y1="9.5" x2="33" y2="9.5" stroke="#15803d" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="23" y1="12" x2="33" y2="12" stroke="#15803d" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Upper display unit -->
  <rect x="12" y="13" width="30" height="14" rx="3" fill="url(#bodyG)" filter="url(#sh)"/>
  <!-- Screen -->
  <rect x="14.5" y="15" width="22" height="8" rx="2" fill="url(#screenG)"/>
  <text x="25.5" y="19.5" text-anchor="middle" dominant-baseline="middle"
        font-family="'Courier New',monospace" font-size="6" font-weight="700" fill="#4ade80">$0.00</text>
  <rect x="14.5" y="15" width="22" height="3.5" rx="2" fill="white" fill-opacity="0.07"/>

  <!-- Main body / base -->
  <rect x="8" y="27" width="48" height="26" rx="4" fill="url(#bodyG)" filter="url(#sh)"/>

  <!-- Keypad - row 1 -->
  <rect x="13" y="32" width="8" height="5" rx="1.5" fill="white" fill-opacity="0.7" filter="url(#shSm)"/>
  <rect x="24" y="32" width="8" height="5" rx="1.5" fill="white" fill-opacity="0.7" filter="url(#shSm)"/>
  <rect x="35" y="32" width="8" height="5" rx="1.5" fill="white" fill-opacity="0.7" filter="url(#shSm)"/>
  <!-- Keypad - row 2 -->
  <rect x="13" y="40" width="8" height="5" rx="1.5" fill="white" fill-opacity="0.7" filter="url(#shSm)"/>
  <rect x="24" y="40" width="8" height="5" rx="1.5" fill="white" fill-opacity="0.7" filter="url(#shSm)"/>
  <!-- Green enter key -->
  <rect x="35" y="40" width="14" height="5" rx="1.5" fill="#4ade80" fill-opacity="0.85" filter="url(#shSm)"/>

  <!-- Drawer pull bar -->
  <rect x="10" y="48" width="44" height="3.5" rx="1.75" fill="url(#drawerG)" filter="url(#shSm)"/>
  <rect x="28" y="48.5" width="8" height="2.5" rx="1.25" fill="white" fill-opacity="0.5"/>

  <!-- Shadow -->
  <ellipse cx="32" cy="58" rx="20" ry="2" fill="#0003"/>
</svg>
