<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="pumpG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="screenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0a0a"/>
      <stop offset="100%" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="nozzleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0004"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Main pump body -->
  <rect x="10" y="12" width="30" height="40" rx="4" fill="url(#pumpG)" filter="url(#sh)"/>

  <!-- Brand stripe -->
  <rect x="10" y="20" width="30" height="5" fill="#ef4444" fill-opacity="0.4"/>

  <!-- Display screen -->
  <rect x="14" y="27" width="22" height="12" rx="3" fill="url(#screenG)" filter="url(#shSm)"/>
  <text x="25" y="33" text-anchor="middle" dominant-baseline="middle"
        font-family="'Courier New',monospace" font-size="6.5" font-weight="700" fill="#4ade80">$0.00</text>
  <text x="25" y="37" text-anchor="middle" font-family="Arial,sans-serif" font-size="3" fill="#86efac">LITROS</text>
  <!-- Screen gloss -->
  <rect x="14" y="27" width="22" height="4" rx="3" fill="white" fill-opacity="0.07"/>

  <!-- Fuel type badge -->
  <rect x="14" y="42" width="9" height="7" rx="1.5" fill="#ef4444" fill-opacity="0.7"/>
  <text x="18.5" y="46" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial,sans-serif" font-size="3.5" font-weight="700" fill="white">GAS</text>
  <rect x="25" y="42" width="12" height="7" rx="1.5" fill="#f97316" fill-opacity="0.7"/>
  <text x="31" y="46" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial,sans-serif" font-size="3.5" font-weight="700" fill="white">DIESEL</text>

  <!-- Base -->
  <rect x="10" y="52" width="30" height="5" rx="2" fill="#fecaca" filter="url(#shSm)"/>

  <!-- Nozzle hook & hose -->
  <path d="M40 24 C48 24 52 28 52 34 L52 44" fill="none" stroke="url(#nozzleG)" stroke-width="3"
        stroke-linecap="round" filter="url(#sh)"/>
  <!-- Nozzle handle -->
  <rect x="47" y="44" width="10" height="6" rx="3" fill="url(#nozzleG)" filter="url(#shSm)"/>
  <rect x="50" y="47" width="4" height="4" rx="2" fill="#f87171"/>

  <!-- Ground shadow -->
  <ellipse cx="25" cy="58.5" rx="16" ry="2" fill="#0003"/>
</svg>
