<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="b-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="b-bell" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="b-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.32"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="b-sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0005"/></filter>
    <filter id="b-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#b-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#b-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#b-gl)"/>
  <!-- Bell shape -->
  <path d="M32 10 C32 10 32 12 32 13 C22 14.5 15 21 15 32 L15 43 L49 43 L49 32 C49 21 42 14.5 32 13 C32 12 32 10 32 10 Z" fill="url(#b-bell)" filter="url(#b-sh)"/>
  <!-- Bell top shine -->
  <path d="M32 13 C24 14.5 18 20 17 29 C22 26 42 26 47 29 C46 20 40 14.5 32 13 Z" fill="white" fill-opacity="0.22"/>
  <!-- Clapper bar -->
  <rect x="12" y="42" width="40" height="5" rx="2.5" fill="#fde68a" filter="url(#b-sh)"/>
  <!-- Clapper ball -->
  <circle cx="32" cy="50" r="5" fill="url(#b-bell)" filter="url(#b-sh)"/>
  <circle cx="30.5" cy="48.5" r="1.5" fill="white" fill-opacity="0.4"/>
  <!-- Notification dot -->
  <circle cx="46" cy="16" r="7" fill="#ef4444" filter="url(#b-glow)"/>
  <text x="46" y="17" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="white">3</text>
</svg>
