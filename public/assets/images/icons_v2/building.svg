<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bd-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="bd-wall" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="bd-side" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#a5b4fc"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="bd-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="bd-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="bd-sm"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bd-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#bd-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#bd-gl)"/>
  <!-- Ground -->
  <rect x="6" y="52" width="52" height="4" rx="2" fill="#818cf8" fill-opacity="0.4"/>
  <!-- Small building left -->
  <rect x="8" y="30" width="16" height="24" rx="2" fill="url(#bd-side)" filter="url(#bd-sm)"/>
  <rect x="11" y="33" width="4" height="4" rx="1" fill="#bfdbfe" fill-opacity="0.7"/>
  <rect x="17" y="33" width="4" height="4" rx="1" fill="#bfdbfe" fill-opacity="0.7"/>
  <rect x="11" y="40" width="4" height="4" rx="1" fill="#bfdbfe" fill-opacity="0.7"/>
  <rect x="17" y="40" width="4" height="4" rx="1" fill="#bfdbfe" fill-opacity="0.7"/>
  <!-- Main building -->
  <rect x="22" y="14" width="28" height="40" rx="2" fill="url(#bd-wall)" filter="url(#bd-sh)"/>
  <!-- Windows grid -->
  <rect x="26" y="18" width="5" height="5" rx="1" fill="#bfdbfe" fill-opacity="0.9"/>
  <rect x="33" y="18" width="5" height="5" rx="1" fill="#bfdbfe" fill-opacity="0.9"/>
  <rect x="40" y="18" width="5" height="5" rx="1" fill="#bfdbfe" fill-opacity="0.9"/>
  <rect x="26" y="26" width="5" height="5" rx="1" fill="#bfdbfe" fill-opacity="0.9"/>
  <rect x="33" y="26" width="5" height="5" rx="1" fill="#93c5fd" fill-opacity="0.9"/>
  <rect x="40" y="26" width="5" height="5" rx="1" fill="#bfdbfe" fill-opacity="0.9"/>
  <rect x="26" y="34" width="5" height="5" rx="1" fill="#bfdbfe" fill-opacity="0.9"/>
  <rect x="33" y="34" width="5" height="5" rx="1" fill="#bfdbfe" fill-opacity="0.9"/>
  <rect x="40" y="34" width="5" height="5" rx="1" fill="#93c5fd" fill-opacity="0.9"/>
  <!-- Door -->
  <rect x="31" y="44" width="9" height="10" rx="2" fill="#818cf8"/>
  <!-- Building shine -->
  <rect x="22" y="14" width="28" height="9" rx="2" fill="white" fill-opacity="0.2"/>
  <!-- Roof flag -->
  <line x1="36" y1="7" x2="36" y2="14" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="36,7 44,9 36,11" fill="#f43f5e"/>
</svg>
