<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="roofG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="wallG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="doorG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0005"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Roof -->
  <polygon points="32,10 9,30 55,30" fill="url(#roofG)" filter="url(#sh)"/>
  <!-- Roof shine -->
  <polygon points="32,10 9,30 20,30" fill="white" fill-opacity="0.18"/>
  <!-- Chimney -->
  <rect x="39" y="14" width="5" height="10" rx="1" fill="#bfdbfe" filter="url(#shSm)"/>

  <!-- Walls -->
  <rect x="13" y="29" width="38" height="24" rx="2" fill="url(#wallG)" filter="url(#sh)"/>
  <!-- Wall shine -->
  <rect x="13" y="29" width="38" height="8" rx="2" fill="white" fill-opacity="0.2"/>

  <!-- Left window -->
  <rect x="16" y="33" width="10" height="9" rx="2" fill="white" fill-opacity="0.55" filter="url(#shSm)"/>
  <line x1="21" y1="33" x2="21" y2="42" stroke="#93c5fd" stroke-width="1"/>
  <line x1="16" y1="37.5" x2="26" y2="37.5" stroke="#93c5fd" stroke-width="1"/>

  <!-- Right window -->
  <rect x="38" y="33" width="10" height="9" rx="2" fill="white" fill-opacity="0.55" filter="url(#shSm)"/>
  <line x1="43" y1="33" x2="43" y2="42" stroke="#93c5fd" stroke-width="1"/>
  <line x1="38" y1="37.5" x2="48" y2="37.5" stroke="#93c5fd" stroke-width="1"/>

  <!-- Door -->
  <rect x="25" y="38" width="14" height="15" rx="2" fill="url(#doorG)" filter="url(#shSm)"/>
  <circle cx="36.5" cy="45.5" r="1.3" fill="#93c5fd"/>
  <!-- Door arch -->
  <path d="M25,41 Q32,34 39,41" fill="url(#doorG)" fill-opacity="0.5"/>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="55" rx="16" ry="2.5" fill="#0003"/>
</svg>
