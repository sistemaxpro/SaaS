<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="es-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="es-pump" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#fdba74"/></linearGradient>
    <linearGradient id="es-screen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="es-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="es-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="es-sm"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0003"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#es-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#es-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#es-gl)"/>
  <!-- Ground -->
  <rect x="6" y="53" width="52" height="5" rx="2" fill="#c2410c" fill-opacity="0.5"/>
  <!-- Pump body -->
  <rect x="14" y="16" width="28" height="38" rx="4" fill="url(#es-pump)" filter="url(#es-sh)"/>
  <!-- Top section -->
  <rect x="14" y="16" width="28" height="10" rx="4" fill="#f97316" fill-opacity="0.4"/>
  <!-- Screen -->
  <rect x="18" y="20" width="20" height="12" rx="2" fill="url(#es-screen)"/>
  <text x="28" y="26" text-anchor="middle" font-family="monospace" font-size="5" font-weight="700" fill="#93c5fd">$1.42</text>
  <text x="28" y="30" text-anchor="middle" font-family="monospace" font-size="4" fill="#60a5fa">LITROS</text>
  <!-- Pump label band -->
  <rect x="14" y="35" width="28" height="6" rx="0" fill="#ea580c" fill-opacity="0.3"/>
  <text x="28" y="39" text-anchor="middle" font-family="Arial,sans-serif" font-size="4.5" font-weight="700" fill="#9a3412">ULTRA</text>
  <!-- Buttons -->
  <circle cx="20" cy="46" r="3" fill="#ea580c" fill-opacity="0.6"/>
  <circle cx="28" cy="46" r="3" fill="#22c55e" fill-opacity="0.7"/>
  <circle cx="36" cy="46" r="3" fill="#ea580c" fill-opacity="0.6"/>
  <!-- Nozzle arm -->
  <path d="M42 22 C50 22 52 26 52 30 L52 38" fill="none" stroke="#fdba74" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Nozzle -->
  <rect x="49" y="37" width="6" height="10" rx="3" fill="#ea580c" filter="url(#es-sm)"/>
  <!-- Pump shine -->
  <rect x="14" y="16" width="28" height="8" rx="4" fill="white" fill-opacity="0.2"/>
</svg>
