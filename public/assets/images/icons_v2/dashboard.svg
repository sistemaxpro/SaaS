<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gaugeG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="panelG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d2340"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowC" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0005"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>

  <!-- Dashboard bezel panel -->
  <rect x="6" y="10" width="52" height="44" rx="6" fill="url(#panelG)" filter="url(#sh)"/>
  <rect x="6" y="10" width="52" height="18" rx="6" fill="white" fill-opacity="0.04"/>

  <!-- Gauge arc (speedometer style) -->
  <path d="M 12 44 A 20 20 0 0 1 52 44" fill="none" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round"/>
  <path d="M 12 44 A 20 20 0 0 1 52 44" fill="none" stroke="url(#gaugeG)" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="62.8" stroke-dashoffset="15" filter="url(#glowC)"/>

  <!-- Gauge tick marks -->
  <line x1="12" y1="42" x2="13.5" y2="40" stroke="white" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="18" y1="28" x2="20" y2="29" stroke="white" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="32" y1="24" x2="32" y2="26" stroke="white" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="46" y1="28" x2="44" y2="29" stroke="white" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="52" y1="42" x2="50.5" y2="40" stroke="white" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Needle -->
  <line x1="32" y1="44" x2="22" y2="30" stroke="white" stroke-width="2" stroke-linecap="round" filter="url(#glowC)"/>
  <circle cx="32" cy="44" r="3.5" fill="white" filter="url(#glowC)"/>
  <circle cx="32" cy="44" r="1.5" fill="#1e293b"/>

  <!-- Mini stats row -->
  <rect x="10" y="14" width="13" height="10" rx="2" fill="#0f172a" fill-opacity="0.6"/>
  <text x="16.5" y="17" text-anchor="middle" font-family="'Courier New',monospace" font-size="4.5" fill="#4ade80" font-weight="700">98%</text>
  <text x="16.5" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.5" fill="#86efac">CPU</text>

  <rect x="25.5" y="14" width="13" height="10" rx="2" fill="#0f172a" fill-opacity="0.6"/>
  <text x="32" y="17" text-anchor="middle" font-family="'Courier New',monospace" font-size="4.5" fill="#67e8f9" font-weight="700">2.4G</text>
  <text x="32" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.5" fill="#a5f3fc">RAM</text>

  <rect x="41" y="14" width="13" height="10" rx="2" fill="#0f172a" fill-opacity="0.6"/>
  <text x="47.5" y="17" text-anchor="middle" font-family="'Courier New',monospace" font-size="4.5" fill="#f472b6" font-weight="700">12ms</text>
  <text x="47.5" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.5" fill="#f9a8d4">LAT</text>
</svg>
