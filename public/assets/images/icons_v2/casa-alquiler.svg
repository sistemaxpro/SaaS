<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="wallG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1e6"/>
      <stop offset="100%" stop-color="#fdd9bc"/>
    </linearGradient>
    <linearGradient id="roofG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="keyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0004"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Roof -->
  <polygon points="8,26 32,8 56,26" fill="url(#roofG)" filter="url(#sh)"/>
  <!-- Roof highlight -->
  <polygon points="32,9 52,25 42,25 32,15" fill="white" fill-opacity="0.1"/>

  <!-- Walls -->
  <rect x="11" y="25" width="42" height="22" rx="2" fill="url(#wallG)" filter="url(#sh)"/>

  <!-- Left window -->
  <rect x="14" y="29" width="10" height="8" rx="2" fill="#bfdbfe" fill-opacity="0.85" filter="url(#shSm)"/>
  <line x1="19" y1="29" x2="19" y2="37" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="14" y1="33" x2="24" y2="33" stroke="white" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Right window -->
  <rect x="40" y="29" width="10" height="8" rx="2" fill="#bfdbfe" fill-opacity="0.85" filter="url(#shSm)"/>
  <line x1="45" y1="29" x2="45" y2="37" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="40" y1="33" x2="50" y2="33" stroke="white" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Door -->
  <path d="M27,47 L27,37.5 Q27,33.5 32,33.5 Q37,33.5 37,37.5 L37,47 Z" fill="#e07b3a" filter="url(#shSm)"/>
  <circle cx="35.5" cy="41" r="1.3" fill="#fbbf24"/>

  <!-- Key badge at bottom-right corner -->
  <circle cx="48" cy="51" r="7" fill="url(#keyG)" filter="url(#sh)"/>
  <circle cx="45" cy="51" r="3.5" fill="none" stroke="white" stroke-width="1.8"/>
  <circle cx="45" cy="51" r="1.2" fill="white" fill-opacity="0.6"/>
  <line x1="48.5" y1="51" x2="55" y2="51" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="53" y1="51" x2="53" y2="53.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
</svg>
