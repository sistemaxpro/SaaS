<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pcd-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#7c2d12"/></linearGradient>
    <linearGradient id="pcd-nozzle" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="pcd-hose" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
    <linearGradient id="pcd-fuel" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="pcd-drop" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="pcd-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.28"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="pcd-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0006"/></filter>
    <filter id="pcd-sm"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0004"/></filter>
    <filter id="pcd-glow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#pcd-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#pcd-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#pcd-gl)"/>

  <!-- Hose (curved tube from top-left to nozzle) -->
  <path d="M14 10 C8 10 6 18 6 24 C6 32 10 36 16 38 C22 40 26 38 28 44"
        fill="none" stroke="url(#pcd-hose)" stroke-width="5" stroke-linecap="round" filter="url(#pcd-sh)"/>
  <!-- Hose highlight -->
  <path d="M14 10 C8 10 6 18 6 24 C6 32 10 36 16 38 C22 40 26 38 28 44"
        fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.25"/>

  <!-- Nozzle body -->
  <g transform="rotate(-35, 32, 50)" filter="url(#pcd-sh)">
    <!-- Main body -->
    <rect x="22" y="44" width="20" height="8" rx="3" fill="url(#pcd-nozzle)"/>
    <!-- Grip ridges -->
    <rect x="25" y="44" width="2" height="8" rx="0" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="29" y="44" width="2" height="8" rx="0" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="33" y="44" width="2" height="8" rx="0" fill="#94a3b8" fill-opacity="0.3"/>
    <!-- Trigger guard -->
    <path d="M26 52 C26 56 36 56 36 52" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Spout -->
    <rect x="38" y="46" width="10" height="4" rx="2" fill="#64748b"/>
    <!-- Spout tip opening -->
    <ellipse cx="48" cy="48" rx="1.5" ry="2.5" fill="#1e293b"/>
  </g>

  <!-- Fuel drops falling from nozzle -->
  <g filter="url(#pcd-glow)">
    <!-- Drop 1 (large) -->
    <path d="M38 44 C38 39 43 35 43 31 C43 27 38 25 38 21 C38 25 33 27 33 31 C33 35 38 39 38 44 Z" fill="url(#pcd-drop)" filter="url(#pcd-sm)"/>
    <!-- Drop 2 (smaller, to the right) -->
    <path d="M48 34 C48 31 51 28.5 51 26 C51 23.5 48 22 48 19 C48 22 45 23.5 45 26 C45 28.5 48 31 48 34 Z" fill="url(#pcd-drop)" fill-opacity="0.7"/>
    <!-- Drop 3 (tiny) -->
    <path d="M54 25 C54 23.5 56 22 56 20.5 C56 19 54 18 54 16 C54 18 52 19 52 20.5 C52 22 54 23.5 54 25 Z" fill="url(#pcd-drop)" fill-opacity="0.5"/>
  </g>

  <!-- Fuel level in drop 1 (inner shine) -->
  <ellipse cx="38" cy="36" rx="2.5" ry="4" fill="white" fill-opacity="0.3"/>

  <!-- Counter display (digital meter) -->
  <rect x="34" y="6" width="22" height="12" rx="3" fill="#1e293b" filter="url(#pcd-sm)"/>
  <rect x="35" y="7" width="20" height="10" rx="2" fill="#0f172a"/>
  <text x="45" y="14" text-anchor="middle" font-family="monospace" font-size="6" font-weight="700" fill="#fbbf24">48.5L</text>
</svg>
