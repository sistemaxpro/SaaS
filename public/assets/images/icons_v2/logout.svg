<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="doorG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="arrowG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0004"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0003"/>
    </filter>
    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Door frame -->
  <rect x="10" y="13" width="26" height="38" rx="3" fill="url(#doorG)" filter="url(#sh)"/>
  <!-- Door panel details -->
  <rect x="14" y="17" width="18" height="13" rx="2" fill="#fecdd3" fill-opacity="0.5"/>
  <rect x="14" y="33" width="18" height="13" rx="2" fill="#fecdd3" fill-opacity="0.5"/>
  <!-- Door knob -->
  <circle cx="33" cy="33" r="2.5" fill="#fb7185" filter="url(#shSm)"/>
  <!-- Door shine -->
  <rect x="10" y="13" width="26" height="9" rx="3" fill="white" fill-opacity="0.2"/>

  <!-- Hinge marks -->
  <circle cx="13" cy="19" r="1.2" fill="#fda4af" fill-opacity="0.8"/>
  <circle cx="13" cy="45" r="1.2" fill="#fda4af" fill-opacity="0.8"/>

  <!-- Exit arrow -->
  <line x1="34" y1="32" x2="54" y2="32" stroke="white" stroke-width="3"
        stroke-linecap="round" filter="url(#arrowGlow)"/>
  <polyline points="47,25 54,32 47,39" fill="none" stroke="white" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)"/>

  <!-- Ground shadow -->
  <ellipse cx="23" cy="53" rx="14" ry="2" fill="#0003"/>
</svg>
