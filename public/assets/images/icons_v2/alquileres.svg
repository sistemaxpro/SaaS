<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="alq-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="alq-house" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ede9fe"/><stop offset="100%" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="alq-roof" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="alq-key" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="alq-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.28"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="alq-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="alq-sm"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0004"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#alq-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#alq-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#alq-gl)"/>

  <!-- House body -->
  <rect x="12" y="30" width="36" height="26" rx="2" fill="url(#alq-house)" filter="url(#alq-sh)"/>
  <!-- Roof triangle -->
  <polygon points="8,32 30,10 52,32" fill="url(#alq-roof)" filter="url(#alq-sh)"/>
  <!-- Roof shine -->
  <polygon points="8,32 20,19 32,19 30,10" fill="white" fill-opacity="0.15"/>
  <!-- Chimney -->
  <rect x="38" y="13" width="5" height="10" rx="1" fill="url(#alq-roof)" filter="url(#alq-sm)"/>

  <!-- Door -->
  <rect x="24" y="42" width="12" height="14" rx="2" fill="#6d28d9" fill-opacity="0.4"/>
  <rect x="24" y="42" width="12" height="5" rx="2" fill="#6d28d9" fill-opacity="0.2"/>
  <!-- Door knob -->
  <circle cx="33" cy="49" r="1.2" fill="#a78bfa"/>

  <!-- Windows -->
  <rect x="14" y="34" width="8" height="7" rx="1.5" fill="#93c5fd" fill-opacity="0.6"/>
  <line x1="18" y1="34" x2="18" y2="41" stroke="white" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="14" y1="37.5" x2="22" y2="37.5" stroke="white" stroke-width="0.8" stroke-opacity="0.5"/>
  <rect x="38" y="34" width="8" height="7" rx="1.5" fill="#93c5fd" fill-opacity="0.6"/>
  <line x1="42" y1="34" x2="42" y2="41" stroke="white" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="38" y1="37.5" x2="46" y2="37.5" stroke="white" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Key badge (bottom-right overlay) -->
  <circle cx="50" cy="52" r="9" fill="url(#alq-key)" filter="url(#alq-sm)"/>
  <!-- Key shape inside badge -->
  <circle cx="47" cy="51" r="3" fill="none" stroke="white" stroke-width="1.8"/>
  <line x1="50" y1="53" x2="56" y2="53" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="54" y1="53" x2="54" y2="55.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="53" x2="52" y2="55" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
