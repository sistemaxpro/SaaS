<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="paperG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="sealG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0004"/>
    </filter>
    <filter id="glowSeal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Paper document -->
  <rect x="11" y="9" width="34" height="44" rx="3" fill="url(#paperG)" filter="url(#sh)"/>
  <!-- Paper top shine -->
  <rect x="11" y="9" width="34" height="9" rx="3" fill="white" fill-opacity="0.3"/>
  <!-- Paper lines (text simulation) -->
  <line x1="17" y1="20" x2="38" y2="20" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="17" y1="26" x2="38" y2="26" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="17" y1="32" x2="38" y2="32" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="17" y1="38" x2="31" y2="38" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Header underline -->
  <line x1="14" y1="15" x2="42" y2="15" stroke="#a78bfa" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- Gold seal (badge) -->
  <circle cx="43" cy="46" r="10" fill="url(#sealG)" filter="url(#sh)"/>
  <!-- Seal star rays -->
  <polygon points="43,37 44.3,41.5 49,41 46,44.5 47.5,49 43,46.5 38.5,49 40,44.5 37,41 41.7,41.5"
           fill="#f59e0b" fill-opacity="0.6"/>
  <!-- Seal ring -->
  <circle cx="43" cy="46" r="7" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Checkmark inside seal -->
  <polyline points="39,46 42,49 48,43" fill="none" stroke="white" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSeal)"/>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="55" rx="17" ry="2" fill="#0003"/>
</svg>
