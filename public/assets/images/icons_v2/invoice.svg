<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="inv-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="inv-paper" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ecfdf5"/><stop offset="100%" stop-color="#d1fae5"/></linearGradient>
    <linearGradient id="inv-stamp" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="inv-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="inv-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="inv-sm"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0004"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#inv-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#inv-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#inv-gl)"/>
  <!-- Receipt / invoice paper -->
  <rect x="13" y="7" width="36" height="50" rx="2" fill="url(#inv-paper)" filter="url(#inv-sh)"/>
  <!-- Header band -->
  <rect x="13" y="7" width="36" height="10" rx="2" fill="#10b981" fill-opacity="0.3"/>
  <text x="31" y="14" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="5.5" font-weight="700" fill="#065f46">FACTURA</text>
  <!-- Line items -->
  <line x1="18" y1="22" x2="44" y2="22" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4"/>
  <rect x="18" y="25" width="18" height="2.5" rx="1" fill="#6ee7b7" fill-opacity="0.7"/>
  <rect x="38" y="25" width="7" height="2.5" rx="1" fill="#6ee7b7" fill-opacity="0.7"/>
  <rect x="18" y="30" width="15" height="2.5" rx="1" fill="#6ee7b7" fill-opacity="0.7"/>
  <rect x="38" y="30" width="7" height="2.5" rx="1" fill="#6ee7b7" fill-opacity="0.7"/>
  <rect x="18" y="35" width="20" height="2.5" rx="1" fill="#6ee7b7" fill-opacity="0.7"/>
  <rect x="38" y="35" width="7" height="2.5" rx="1" fill="#6ee7b7" fill-opacity="0.7"/>
  <!-- Total line -->
  <line x1="18" y1="41" x2="46" y2="41" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="18" y="46" font-family="Arial,sans-serif" font-size="5" font-weight="700" fill="#065f46">TOTAL</text>
  <text x="46" y="46" text-anchor="end" font-family="'Courier New',monospace" font-size="5.5" font-weight="700" fill="#065f46">$999</text>
  <!-- PAGADO stamp -->
  <rect x="28" y="47" width="22" height="8" rx="2" fill="none" stroke="#10b981" stroke-width="1.5" transform="rotate(-12 39 51)"/>
  <text x="39" y="52" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="5" font-weight="700" fill="#10b981" transform="rotate(-12 39 51)">PAGADO</text>
  <!-- Paper shine -->
  <rect x="13" y="7" width="36" height="9" rx="2" fill="white" fill-opacity="0.25"/>
  <ellipse cx="31" cy="59" rx="15" ry="2" fill="#0003"/>
</svg>
