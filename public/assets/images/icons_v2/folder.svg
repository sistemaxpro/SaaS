<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="backG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="frontG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0005"/>
    </filter>
    <filter id="shSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Folder back -->
  <path d="M8 26 L8 52 Q8 54 10 54 L54 54 Q56 54 56 52 L56 28 Q56 26 54 26 L32 26 L27 19 Q26 17 24 17 L10 17 Q8 17 8 19 Z"
        fill="url(#backG)" filter="url(#sh)"/>

  <!-- Folder tab -->
  <path d="M10 17 L24 17 L29 25 L10 25 Z" fill="#f59e0b"/>

  <!-- Folder front body -->
  <rect x="8" y="31" width="48" height="23" rx="3" fill="url(#frontG)" filter="url(#shSm)"/>

  <!-- Tab shadow fold line -->
  <line x1="8" y1="31" x2="56" y2="31" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Paper pages peeking out -->
  <rect x="16" y="27" width="12" height="6" rx="1" fill="white" fill-opacity="0.7" transform="rotate(-3 22 30)"/>
  <rect x="28" y="26" width="12" height="6" rx="1" fill="white" fill-opacity="0.6" transform="rotate(2 34 29)"/>

  <!-- Front folder shine -->
  <rect x="8" y="31" width="48" height="9" rx="3" fill="white" fill-opacity="0.18"/>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="57" rx="22" ry="2.5" fill="#0004"/>
</svg>
