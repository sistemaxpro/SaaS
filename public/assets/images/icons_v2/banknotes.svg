<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="bill3G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bill2G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="bill1G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0005"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0004"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Bill 3 (back) -->
  <rect x="12" y="14" width="46" height="26" rx="4" fill="url(#bill3G)" filter="url(#sh)" opacity="0.8"/>
  <ellipse cx="35" cy="27" rx="7" ry="7" fill="none" stroke="#065f46" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="15" y="17" width="7" height="4" rx="1" fill="#065f46" fill-opacity="0.2"/>
  <rect x="44" y="17" width="7" height="4" rx="1" fill="#065f46" fill-opacity="0.2"/>

  <!-- Bill 2 (middle) -->
  <rect x="8" y="19" width="46" height="26" rx="4" fill="url(#bill2G)" filter="url(#sh)"/>
  <ellipse cx="31" cy="32" rx="7" ry="7" fill="none" stroke="#065f46" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="11" y="22" width="7" height="4" rx="1" fill="#065f46" fill-opacity="0.2"/>
  <rect x="40" y="22" width="7" height="4" rx="1" fill="#065f46" fill-opacity="0.2"/>

  <!-- Bill 1 (front) -->
  <rect x="5" y="25" width="46" height="26" rx="4" fill="url(#bill1G)" filter="url(#sh)"/>
  <!-- Bill inner oval -->
  <ellipse cx="28" cy="38" rx="9" ry="9" fill="none" stroke="#065f46" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Dollar sign on bill -->
  <text x="28" y="38" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#065f46" fill-opacity="0.7">$</text>
  <!-- Corner seals -->
  <rect x="8" y="28" width="8" height="5" rx="1.5" fill="#065f46" fill-opacity="0.18"/>
  <rect x="37" y="28" width="8" height="5" rx="1.5" fill="#065f46" fill-opacity="0.18"/>
  <rect x="8" y="43" width="8" height="5" rx="1.5" fill="#065f46" fill-opacity="0.18"/>
  <rect x="37" y="43" width="8" height="5" rx="1.5" fill="#065f46" fill-opacity="0.18"/>
  <!-- Bill shine -->
  <rect x="5" y="25" width="46" height="8" rx="4" fill="white" fill-opacity="0.18"/>

  <!-- Ground shadow -->
  <ellipse cx="28" cy="53" rx="22" ry="2" fill="#0004"/>
</svg>
