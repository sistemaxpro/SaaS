<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#15803d"/></linearGradient>
    <linearGradient id="sc-cart" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="sc-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="sc-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="sc-sm"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0003"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sc-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#sc-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#sc-gl)"/>
  <!-- Cart handle -->
  <path d="M8 12 L14 12 L20 38 L50 38 L55 20 L18 20" fill="none" stroke="url(#sc-cart)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#sc-sh)"/>
  <!-- Cart basket -->
  <path d="M18 20 L50 20 L46 38 L22 38 Z" fill="url(#sc-cart)" fill-opacity="0.9" filter="url(#sc-sm)"/>
  <!-- Items in cart -->
  <rect x="25" y="23" width="6" height="9" rx="1" fill="#16a34a" fill-opacity="0.4"/>
  <rect x="33" y="24" width="5" height="8" rx="1" fill="#16a34a" fill-opacity="0.4"/>
  <rect x="40" y="22" width="4" height="10" rx="1" fill="#16a34a" fill-opacity="0.4"/>
  <!-- Wheels -->
  <circle cx="27" cy="44" r="5" fill="url(#sc-cart)" filter="url(#sc-sm)"/>
  <circle cx="27" cy="44" r="2.5" fill="#16a34a"/>
  <circle cx="27" cy="44" r="1" fill="white" fill-opacity="0.5"/>
  <circle cx="44" cy="44" r="5" fill="url(#sc-cart)" filter="url(#sc-sm)"/>
  <circle cx="44" cy="44" r="2.5" fill="#16a34a"/>
  <circle cx="44" cy="44" r="1" fill="white" fill-opacity="0.5"/>
  <!-- Price tag -->
  <rect x="40" y="8" width="16" height="9" rx="3" fill="#16a34a" filter="url(#sc-sm)"/>
  <text x="48" y="14" text-anchor="middle" font-family="monospace" font-size="5.5" font-weight="700" fill="white">$</text>
</svg>
