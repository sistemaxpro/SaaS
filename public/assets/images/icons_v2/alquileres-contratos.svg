<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="act-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="act-doc" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="act-pen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="act-roof" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="act-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.28"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="act-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="act-sm"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0004"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#act-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#act-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#act-gl)"/>

  <!-- Document -->
  <rect x="10" y="7" width="36" height="46" rx="3" fill="url(#act-doc)" filter="url(#act-sh)"/>
  <!-- Folded corner -->
  <path d="M38 7 L46 7 L46 15 Z" fill="#bfdbfe" fill-opacity="0.8"/>
  <path d="M38 7 L38 15 L46 15" fill="none" stroke="#93c5fd" stroke-width="0.8"/>

  <!-- Mini house on header -->
  <rect x="13" y="10" width="30" height="10" rx="2" fill="#3b82f6" fill-opacity="0.2"/>
  <!-- House roof -->
  <polygon points="21,19 28,12 35,19" fill="url(#act-roof)" filter="url(#act-sm)"/>
  <!-- House body -->
  <rect x="22" y="19" width="12" height="8" rx="1" fill="#dbeafe"/>
  <!-- House door -->
  <rect x="26" y="23" width="4" height="4" rx="1" fill="#3b82f6" fill-opacity="0.5"/>
  <!-- House window -->
  <rect x="23" y="20" width="3" height="3" rx="0.5" fill="#93c5fd" fill-opacity="0.8"/>
  <rect x="30" y="20" width="3" height="3" rx="0.5" fill="#93c5fd" fill-opacity="0.8"/>

  <!-- Contract lines -->
  <line x1="13" y1="31" x2="37" y2="31" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="13" y1="35" x2="34" y2="35" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="13" y1="39" x2="36" y2="39" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Signature line -->
  <line x1="13" y1="47" x2="34" y2="47" stroke="#1d4ed8" stroke-width="0.8" stroke-opacity="0.4"/>
  <!-- Signature squiggle -->
  <path d="M13 45 Q16 42 19 45 Q22 48 25 45 Q28 42 31 45" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Document shine -->
  <rect x="10" y="7" width="36" height="8" rx="3" fill="white" fill-opacity="0.25"/>

  <!-- Pen -->
  <g transform="rotate(-35, 50, 50)" filter="url(#act-sm)">
    <rect x="46" y="40" width="5" height="17" rx="2" fill="url(#act-pen)"/>
    <polygon points="46,57 51,57 48.5,63" fill="#92400e"/>
    <rect x="46" y="40" width="5" height="4" rx="2" fill="#92400e" fill-opacity="0.5"/>
  </g>
</svg>
