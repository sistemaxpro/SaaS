<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="paperG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="foldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="avatarG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="badgeG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0005"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Paper document (back) -->
  <rect x="18" y="12" width="28" height="36" rx="3" fill="url(#paperG)" fill-opacity="0.5" filter="url(#sh)"/>

  <!-- Paper document (front) with fold corner -->
  <path d="M13 15 Q13 12 16 12 H39 L46 19 V51 Q46 54 43 54 H16 Q13 54 13 51 Z" fill="url(#paperG)" filter="url(#sh)"/>
  <!-- Fold triangle -->
  <path d="M39 12 L46 19 H42 Q39 19 39 16 Z" fill="url(#foldG)"/>

  <!-- Client avatar (circle with person) -->
  <circle cx="29" cy="24" r="7" fill="url(#avatarG)" filter="url(#shSm)"/>
  <circle cx="29" cy="21.5" r="2.8" fill="white" fill-opacity="0.9"/>
  <path d="M22 31 Q22 27 29 27 Q36 27 36 31" fill="white" fill-opacity="0.9"/>

  <!-- Lines (quote items) -->
  <rect x="18" y="34" width="14" height="2" rx="1" fill="#0284c7" fill-opacity="0.5"/>
  <rect x="34" y="34" width="8" height="2" rx="1" fill="#0284c7" fill-opacity="0.4"/>
  <rect x="18" y="39" width="10" height="2" rx="1" fill="#0284c7" fill-opacity="0.4"/>
  <rect x="30" y="39" width="12" height="2" rx="1" fill="#0284c7" fill-opacity="0.3"/>
  <rect x="18" y="44" width="16" height="2" rx="1" fill="#0284c7" fill-opacity="0.35"/>

  <!-- Price badge (bottom right) -->
  <circle cx="48" cy="48" r="8" fill="url(#badgeG)" filter="url(#shSm)"/>
  <text x="48" y="51.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="white">Gs</text>

  <!-- Ground shadow -->
  <ellipse cx="30" cy="57" rx="14" ry="2" fill="#0003"/>
</svg>
