<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="vai-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a1e"/></linearGradient>
    <linearGradient id="vai-film" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="vai-scissors" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="vai-ai" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="vai-glow1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="vai-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.15"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="vai-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0007"/></filter>
    <filter id="vai-sm"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0005"/></filter>
    <filter id="vai-glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vai-sparkle">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#vai-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#vai-gl)"/>

  <!-- Film strip background -->
  <rect x="7" y="20" width="50" height="28" rx="3" fill="url(#vai-film)" fill-opacity="0.5" filter="url(#vai-sh)"/>
  <!-- Film perforations left -->
  <rect x="7" y="22" width="5" height="4" rx="1" fill="#0f0a1e"/>
  <rect x="7" y="28" width="5" height="4" rx="1" fill="#0f0a1e"/>
  <rect x="7" y="34" width="5" height="4" rx="1" fill="#0f0a1e"/>
  <rect x="7" y="40" width="5" height="4" rx="1" fill="#0f0a1e"/>
  <!-- Film perforations right -->
  <rect x="52" y="22" width="5" height="4" rx="1" fill="#0f0a1e"/>
  <rect x="52" y="28" width="5" height="4" rx="1" fill="#0f0a1e"/>
  <rect x="52" y="34" width="5" height="4" rx="1" fill="#0f0a1e"/>
  <rect x="52" y="40" width="5" height="4" rx="1" fill="#0f0a1e"/>
  <!-- Film content area -->
  <rect x="13" y="21" width="38" height="26" rx="2" fill="#3730a3" fill-opacity="0.4"/>
  <!-- Film shine -->
  <rect x="7" y="20" width="50" height="6" rx="3" fill="white" fill-opacity="0.08"/>

  <!-- Glowing cut line (where AI cuts) -->
  <line x1="32" y1="16" x2="32" y2="52"
        stroke="url(#vai-glow1)" stroke-width="1.5"
        stroke-dasharray="3 2" stroke-opacity="0.9" filter="url(#vai-glow)"/>

  <!-- Scissors (centered on cut line, open) -->
  <!-- Top blade -->
  <g filter="url(#vai-sh)">
    <path d="M32 31 L18 22" stroke="url(#vai-scissors)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="18" cy="22" r="4" fill="url(#vai-scissors)"/>
    <circle cx="18" cy="22" r="2" fill="#1e1b4b"/>
    <!-- Bottom blade -->
    <path d="M32 31 L18 40" stroke="url(#vai-scissors)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="18" cy="40" r="4" fill="url(#vai-scissors)"/>
    <circle cx="18" cy="40" r="2" fill="#1e1b4b"/>
    <!-- Pivot -->
    <circle cx="32" cy="31" r="3" fill="url(#vai-scissors)"/>
    <circle cx="32" cy="31" r="1.5" fill="#3730a3"/>
  </g>

  <!-- AI badge (right side) -->
  <rect x="38" y="24" width="16" height="14" rx="4" fill="url(#vai-ai)" filter="url(#vai-sm)"/>
  <!-- AI text -->
  <text x="46" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="900" fill="white" letter-spacing="-0.5">AI</text>

  <!-- Sparkle stars (AI magic) -->
  <g filter="url(#vai-sparkle)">
    <!-- Sparkle 1 -->
    <line x1="54" y1="10" x2="54" y2="16" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="51" y1="13" x2="57" y2="13" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sparkle 2 (small) -->
    <line x1="44" y1="7" x2="44" y2="11" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="42" y1="9" x2="46" y2="9" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Sparkle 3 (tiny) -->
    <line x1="58" y1="18" x2="58" y2="21" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round"/>
    <line x1="56.5" y1="19.5" x2="59.5" y2="19.5" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- V letter branding (bottom left) -->
  <text x="10" y="58" font-family="Arial,sans-serif" font-size="10" font-weight="900" fill="#6366f1" fill-opacity="0.5" letter-spacing="-1">V</text>
</svg>
