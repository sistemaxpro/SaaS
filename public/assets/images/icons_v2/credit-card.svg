<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="card2G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="chipG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0006"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0004"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Back card (offset) -->
  <rect x="12" y="16" width="44" height="28" rx="5" fill="url(#cardG)" filter="url(#sh)" opacity="0.75"/>
  <!-- Shimmer on back card -->
  <rect x="12" y="16" width="44" height="10" rx="5" fill="white" fill-opacity="0.07"/>

  <!-- Front card -->
  <rect x="8" y="21" width="44" height="28" rx="5" fill="url(#card2G)" filter="url(#sh)"/>
  <!-- Magnetic stripe -->
  <rect x="8" y="29" width="44" height="7" fill="#0f172a" fill-opacity="0.6"/>
  <!-- Gloss on stripe -->
  <rect x="8" y="29" width="44" height="2" fill="white" fill-opacity="0.06"/>

  <!-- Chip -->
  <rect x="13" y="23" width="10" height="8" rx="2" fill="url(#chipG)" filter="url(#shSm)"/>
  <!-- Chip circuit lines -->
  <line x1="16" y1="23" x2="16" y2="31" stroke="#92400e" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="19" y1="23" x2="19" y2="31" stroke="#92400e" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="13" y1="26" x2="23" y2="26" stroke="#92400e" stroke-width="0.6" stroke-opacity="0.5"/>
  <line x1="13" y1="28.5" x2="23" y2="28.5" stroke="#92400e" stroke-width="0.6" stroke-opacity="0.5"/>

  <!-- Card number dots -->
  <circle cx="15" cy="39" r="1.5" fill="white" fill-opacity="0.7"/>
  <circle cx="19" cy="39" r="1.5" fill="white" fill-opacity="0.7"/>
  <circle cx="23" cy="39" r="1.5" fill="white" fill-opacity="0.7"/>
  <circle cx="27" cy="39" r="1.5" fill="white" fill-opacity="0.7"/>
  <circle cx="33" cy="39" r="1.5" fill="white" fill-opacity="0.7"/>
  <circle cx="37" cy="39" r="1.5" fill="white" fill-opacity="0.7"/>
  <circle cx="41" cy="39" r="1.5" fill="white" fill-opacity="0.7"/>
  <circle cx="45" cy="39" r="1.5" fill="white" fill-opacity="0.7"/>

  <!-- Contactless symbol -->
  <path d="M39 25 Q43 27.5 43 31" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M41 23.5 Q47 27.5 47 32.5" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Ground shadow -->
  <ellipse cx="30" cy="51" rx="22" ry="2" fill="#0004"/>
</svg>
