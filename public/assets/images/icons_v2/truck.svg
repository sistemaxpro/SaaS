<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cabinG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="cargoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="windshieldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0004"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Cargo box -->
  <rect x="5" y="18" width="32" height="24" rx="2.5" fill="url(#cargoG)" filter="url(#sh)"/>
  <!-- Cargo door seam -->
  <line x1="21" y1="18" x2="21" y2="42" stroke="#93c5fd" stroke-width="1"/>
  <!-- Cargo bolt details -->
  <circle cx="8.5" cy="21" r="1" fill="#93c5fd" fill-opacity="0.7"/>
  <circle cx="8.5" cy="39" r="1" fill="#93c5fd" fill-opacity="0.7"/>

  <!-- Cabin -->
  <rect x="37" y="24" width="22" height="18" rx="3" fill="url(#cabinG)" filter="url(#sh)"/>
  <!-- Windshield -->
  <rect x="39" y="26" width="14" height="9" rx="2" fill="url(#windshieldG)" fill-opacity="0.8"/>
  <!-- Windshield gloss -->
  <rect x="40" y="27" width="12" height="4" rx="1.5" fill="white" fill-opacity="0.25"/>
  <!-- Headlight -->
  <rect x="56" y="35" width="3" height="4" rx="1" fill="#fef08a"/>
  <!-- Exhaust pipe -->
  <rect x="37" y="30" width="3" height="7" rx="1.5" fill="#bae6fd"/>

  <!-- Road line / ground -->
  <rect x="5" y="42" width="54" height="3" rx="1.5" fill="#0281" />

  <!-- Wheels -->
  <circle cx="16" cy="44" r="7" fill="#1e3a5f" filter="url(#sh)"/>
  <circle cx="16" cy="44" r="4.5" fill="#334e7a"/>
  <circle cx="16" cy="44" r="2" fill="#93c5fd"/>
  <circle cx="46" cy="44" r="7" fill="#1e3a5f" filter="url(#sh)"/>
  <circle cx="46" cy="44" r="4.5" fill="#334e7a"/>
  <circle cx="46" cy="44" r="2" fill="#93c5fd"/>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="53" rx="26" ry="2.5" fill="#0003"/>
</svg>
