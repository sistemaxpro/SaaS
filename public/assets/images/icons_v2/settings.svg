<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gearG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="innerG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0006"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0004"/>
    </filter>
    <filter id="glowInner" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>

  <!-- Large gear -->
  <g filter="url(#sh)">
    <circle cx="32" cy="32" r="14" fill="url(#gearG)"/>
    <!-- Gear teeth (8 teeth via rotated rects) -->
    <rect x="29.5" y="14" width="5" height="7" rx="2" fill="url(#gearG)"/>
    <rect x="29.5" y="43" width="5" height="7" rx="2" fill="url(#gearG)"/>
    <rect x="43" y="29.5" width="7" height="5" rx="2" fill="url(#gearG)"/>
    <rect x="14" y="29.5" width="7" height="5" rx="2" fill="url(#gearG)"/>
    <rect x="18.5" y="18.5" width="5" height="5" rx="1.5" fill="url(#gearG)" transform="rotate(45 21 21)"/>
    <rect x="40.5" y="18.5" width="5" height="5" rx="1.5" fill="url(#gearG)" transform="rotate(45 43 21)"/>
    <rect x="18.5" y="40.5" width="5" height="5" rx="1.5" fill="url(#gearG)" transform="rotate(45 21 43)"/>
    <rect x="40.5" y="40.5" width="5" height="5" rx="1.5" fill="url(#gearG)" transform="rotate(45 43 43)"/>
    <!-- Inner circle cutout -->
    <circle cx="32" cy="32" r="6.5" fill="url(#innerG)"/>
  </g>
  <!-- Gear face highlight arc -->
  <path d="M 22 24 A 13 13 0 0 1 42 24" fill="none" stroke="white" stroke-width="1.5"
        stroke-linecap="round" stroke-opacity="0.2"/>

  <!-- Center accent dot (blue) -->
  <circle cx="32" cy="32" r="4" fill="url(#accentG)" filter="url(#glowInner)"/>
  <circle cx="30.5" cy="30.5" r="1" fill="white" fill-opacity="0.5"/>
</svg>
