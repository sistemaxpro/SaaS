<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pp-paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="pp-tab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="pp-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pp-box-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pp-arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="pp-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pp-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0005"/>
    </filter>
    <filter id="pp-sm" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#0004"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#pp-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#pp-gloss)"/>
  <rect y="18" width="64" height="14" fill="url(#pp-gloss)"/>

  <!-- Documento principal -->
  <g filter="url(#pp-sh)">
    <rect x="12" y="9" width="30" height="44" rx="6" fill="url(#pp-paper)"/>
    <path d="M16 9 H38 C40.2 9 42 10.8 42 13 V18 H12 V13 C12 10.8 13.8 9 16 9 Z" fill="url(#pp-tab)"/>
    <circle cx="18.4" cy="14.5" r="1.3" fill="#fff" fill-opacity="0.9"/>
    <circle cx="22.1" cy="14.5" r="1.3" fill="#fff" fill-opacity="0.7"/>
    <circle cx="25.8" cy="14.5" r="1.3" fill="#fff" fill-opacity="0.5"/>
    <rect x="15" y="23" width="18" height="2.4" rx="1.2" fill="#60a5fa" fill-opacity="0.72"/>
    <rect x="15" y="28" width="21" height="2.4" rx="1.2" fill="#93c5fd" fill-opacity="0.82"/>
    <rect x="15" y="33" width="16" height="2.4" rx="1.2" fill="#60a5fa" fill-opacity="0.68"/>
    <rect x="15" y="38" width="19" height="2.4" rx="1.2" fill="#93c5fd" fill-opacity="0.8"/>
    <rect x="15" y="44" width="13" height="5" rx="2.5" fill="#10b981"/>
    <text x="21.5" y="47.1" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="4.5" font-weight="700" fill="#fff">OK</text>
  </g>

  <!-- Caja y envío -->
  <g filter="url(#pp-sm)">
    <path d="M38 27 L49 22 L57 26 L46 31 Z" fill="url(#pp-box)"/>
    <path d="M38 27 L38 40 L46 45 L46 31 Z" fill="#f59e0b"/>
    <path d="M46 31 L46 45 L57 40 L57 26 Z" fill="url(#pp-box-side)"/>
    <path d="M41.8 24.6 L53.2 29.2" stroke="#fff9" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M45.8 31.2 L45.8 44.8" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <path d="M29 35.5 C33 35.5 35 35.5 38 35.5" stroke="url(#pp-arrow)" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <path d="M38 35.5 L35.7 33.2 M38 35.5 L35.7 37.8" stroke="url(#pp-arrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Burbuja de proveedor -->
  <circle cx="51.5" cy="47" r="7.4" fill="#111827" fill-opacity="0.16"/>
  <circle cx="51.5" cy="46" r="7" fill="#22c55e"/>
  <text x="51.5" y="46.2" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#fff">PV</text>

  <ellipse cx="32" cy="57" rx="24" ry="2.4" fill="#0003"/>
</svg>
