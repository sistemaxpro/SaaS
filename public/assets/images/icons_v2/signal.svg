  <circle cx="32" cy="43" r="4.5" fill="white" filter="url(#sig-sh)"/>
  <circle cx="32" cy="43" r="2.5" fill="#065f46"/>
  <!-- Status bars at bottom -->
  <rect x="9" y="51" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.4"/>
  <rect x="17" y="48" width="6" height="9" rx="1.5" fill="white" fill-opacity="0.55"/>
  <rect x="25" y="45" width="6" height="12" rx="1.5" fill="white" fill-opacity="0.7"/>
  <rect x="33" y="42" width="6" height="15" rx="1.5" fill="white" fill-opacity="0.85"/>
  <rect x="41" y="51" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.35"/>
  <rect x="49" y="48" width="6" height="9" rx="1.5" fill="white" fill-opacity="0.5"/>
</svg>
