<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="trk-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#042f2e"/></linearGradient>
    <linearGradient id="trk-phone" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ccfbf1"/><stop offset="100%" stop-color="#99f6e4"/></linearGradient>
    <linearGradient id="trk-screen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#134e4a"/></linearGradient>
    <linearGradient id="trk-pin" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#9f1239"/></linearGradient>
    <linearGradient id="trk-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.28"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="trk-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0006"/></filter>
    <filter id="trk-sm"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0004"/></filter>
    <filter id="trk-glow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#trk-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#trk-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#trk-gl)"/>

  <!-- GPS trail path (dashed curved breadcrumbs) -->
  <path d="M10 50 C14 44 12 38 18 34 C24 30 28 36 34 30 C40 24 38 16 45 13"
        fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="2.5 3.5" stroke-opacity="0.7" filter="url(#trk-glow)"/>

  <!-- Trail dots (past positions) -->
  <circle cx="10" cy="50" r="2.5" fill="#2dd4bf" fill-opacity="0.4"/>
  <circle cx="18" cy="34" r="2.5" fill="#2dd4bf" fill-opacity="0.5"/>
  <circle cx="34" cy="30" r="2.5" fill="#2dd4bf" fill-opacity="0.6"/>

  <!-- Phone (current position, slightly rotated to show movement) -->
  <g transform="rotate(15, 45, 22)" filter="url(#trk-sh)">
    <rect x="37" y="11" width="16" height="26" rx="4" fill="url(#trk-phone)"/>
    <!-- Screen -->
    <rect x="39" y="14" width="12" height="18" rx="2" fill="url(#trk-screen)"/>
    <!-- Map on screen -->
    <line x1="39" y1="20" x2="51" y2="20" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.5"/>
    <line x1="39" y1="25" x2="51" y2="25" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.5"/>
    <line x1="44" y1="14" x2="44" y2="32" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.5"/>
    <!-- Location dot on screen -->
    <circle cx="46" cy="22" r="2" fill="#f43f5e" filter="url(#trk-sm)"/>
    <circle cx="46" cy="22" r="0.8" fill="white" fill-opacity="0.7"/>
    <!-- Home bar -->
    <rect x="43" y="35" width="6" height="1.5" rx="0.75" fill="#0d9488" fill-opacity="0.6"/>
  </g>

  <!-- Destination pin -->
  <path d="M45 7 C42 7 39 10 39 13 C39 18 45 24 45 24 C45 24 51 18 51 13 C51 10 48 7 45 7 Z"
        fill="url(#trk-pin)" filter="url(#trk-sm)"/>
  <circle cx="45" cy="13" r="3.5" fill="white" fill-opacity="0.85"/>
  <circle cx="45" cy="13" r="1.8" fill="#f43f5e"/>

  <!-- Speed/accuracy pulse rings around phone -->
  <circle cx="45" cy="22" r="8" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="45" cy="22" r="12" fill="none" stroke="#2dd4bf" stroke-width="0.7" stroke-opacity="0.15"/>

  <!-- Signal arcs near top of phone -->
  <path d="M52 14 C54 12 54 8 52 6" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M54 16 C58 12 58 6 54 2" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
