<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="apr-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="apr-wall" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="apr-roof1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="apr-roof2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="apr-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.28"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="apr-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="apr-sm"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0004"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#apr-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#apr-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#apr-gl)"/>

  <!-- Ground -->
  <rect x="5" y="51" width="54" height="5" rx="2" fill="#0369a1" fill-opacity="0.4"/>

  <!-- Left house (smaller) -->
  <rect x="6" y="34" width="18" height="18" rx="2" fill="url(#apr-wall)" filter="url(#apr-sm)"/>
  <polygon points="4,35 15,22 26,35" fill="url(#apr-roof2)" filter="url(#apr-sm)"/>
  <!-- Left house windows -->
  <rect x="8" y="37" width="5" height="5" rx="1" fill="#7dd3fc" fill-opacity="0.8"/>
  <rect x="16" y="37" width="5" height="5" rx="1" fill="#7dd3fc" fill-opacity="0.8"/>
  <!-- Left house door -->
  <rect x="11" y="44" width="6" height="8" rx="1" fill="#0284c7" fill-opacity="0.4"/>

  <!-- Right house (larger/main) -->
  <rect x="30" y="27" width="28" height="25" rx="2" fill="url(#apr-wall)" filter="url(#apr-sh)"/>
  <polygon points="27,28 44,12 61,28" fill="url(#apr-roof1)" filter="url(#apr-sh)"/>
  <!-- Shine on roof -->
  <polygon points="27,28 35,19 44,19 44,12" fill="white" fill-opacity="0.15"/>
  <!-- Right house windows row 1 -->
  <rect x="33" y="31" width="6" height="5" rx="1" fill="#7dd3fc" fill-opacity="0.8"/>
  <rect x="42" y="31" width="6" height="5" rx="1" fill="#7dd3fc" fill-opacity="0.8"/>
  <rect x="51" y="31" width="5" height="5" rx="1" fill="#7dd3fc" fill-opacity="0.8"/>
  <!-- Right house windows row 2 -->
  <rect x="33" y="39" width="6" height="5" rx="1" fill="#38bdf8" fill-opacity="0.7"/>
  <rect x="42" y="39" width="6" height="5" rx="1" fill="#7dd3fc" fill-opacity="0.8"/>
  <!-- Right house door -->
  <rect x="50" y="41" width="7" height="11" rx="1" fill="#0284c7" fill-opacity="0.4"/>

  <!-- Location pins -->
  <path d="M15 19 C13 19 11 21 11 23 C11 26 15 30 15 30 C15 30 19 26 19 23 C19 21 17 19 15 19 Z" fill="#f43f5e" filter="url(#apr-sm)"/>
  <circle cx="15" cy="23" r="2.5" fill="white" fill-opacity="0.85"/>
  <circle cx="15" cy="23" r="1.2" fill="#f43f5e"/>

  <path d="M44 7 C42 7 40 9 40 11 C40 14 44 18 44 18 C44 18 48 14 48 11 C48 9 46 7 44 7 Z" fill="#fbbf24" filter="url(#apr-sm)"/>
  <circle cx="44" cy="11" r="2.5" fill="white" fill-opacity="0.85"/>
  <circle cx="44" cy="11" r="1.2" fill="#f59e0b"/>
</svg>
