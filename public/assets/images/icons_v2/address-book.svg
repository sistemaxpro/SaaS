<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="bookG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <linearGradient id="spineG" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0004"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect width="64" height="32" rx="14" fill="url(#glossG)"/>
  <rect y="18" width="64" height="14" fill="url(#glossG)"/>

  <!-- Book body -->
  <rect x="17" y="10" width="31" height="44" rx="3" fill="url(#bookG)" filter="url(#sh)"/>
  <!-- Spine -->
  <rect x="17" y="10" width="8" height="44" rx="3" fill="url(#spineG)" filter="url(#shSm)"/>
  <!-- Spine lines -->
  <line x1="17" y1="21" x2="25" y2="21" stroke="white" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="17" y1="32" x2="25" y2="32" stroke="white" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="17" y1="43" x2="25" y2="43" stroke="white" stroke-width="0.8" stroke-opacity="0.35"/>
  <!-- Spine ring markers -->
  <circle cx="21" cy="21" r="2" fill="white" fill-opacity="0.5"/>
  <circle cx="21" cy="32" r="2" fill="white" fill-opacity="0.5"/>
  <circle cx="21" cy="43" r="2" fill="white" fill-opacity="0.5"/>

  <!-- Contact entries -->
  <!-- Entry 1: mini avatar + lines -->
  <circle cx="34" cy="21" r="3.5" fill="#0891b2" fill-opacity="0.5"/>
  <line x1="40" y1="19.5" x2="44" y2="19.5" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>
  <line x1="40" y1="23" x2="46" y2="23" stroke="#0891b2" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Divider -->
  <line x1="28" y1="27" x2="46" y2="27" stroke="#0891b2" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- Entry 2 -->
  <circle cx="34" cy="32" r="3.5" fill="#06b6d4" fill-opacity="0.5"/>
  <line x1="40" y1="30.5" x2="44" y2="30.5" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>
  <line x1="40" y1="34" x2="46" y2="34" stroke="#0891b2" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Divider -->
  <line x1="28" y1="38" x2="46" y2="38" stroke="#0891b2" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- Entry 3 -->
  <circle cx="34" cy="43" r="3.5" fill="#22d3ee" fill-opacity="0.5"/>
  <line x1="40" y1="41.5" x2="44" y2="41.5" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>
  <line x1="40" y1="45" x2="46" y2="45" stroke="#0891b2" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Page shine -->
  <rect x="17" y="10" width="31" height="9" rx="3" fill="white" fill-opacity="0.15"/>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="56" rx="16" ry="2" fill="#0003"/>
</svg>
