<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="inv2-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <linearGradient id="inv2-box" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="inv2-side" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="inv2-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="inv2-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="inv2-sm"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0003"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#inv2-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#inv2-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#inv2-gl)"/>
  <!-- Bottom box (largest) -->
  <rect x="8" y="42" width="48" height="14" rx="3" fill="url(#inv2-side)" filter="url(#inv2-sh)"/>
  <rect x="8" y="38" width="48" height="8" rx="3" fill="url(#inv2-box)" filter="url(#inv2-sm)"/>
  <!-- Tape stripe on bottom box -->
  <rect x="28" y="38" width="8" height="16" rx="0" fill="#d97706" fill-opacity="0.3"/>
  <!-- Middle box -->
  <rect x="14" y="27" width="36" height="13" rx="3" fill="url(#inv2-side)" filter="url(#inv2-sm)"/>
  <rect x="14" y="23" width="36" height="8" rx="3" fill="url(#inv2-box)" filter="url(#inv2-sm)"/>
  <!-- Tape stripe on middle box -->
  <rect x="28" y="23" width="6" height="17" rx="0" fill="#d97706" fill-opacity="0.3"/>
  <!-- Top box (smallest) -->
  <rect x="20" y="15" width="24" height="10" rx="3" fill="url(#inv2-side)" filter="url(#inv2-sm)"/>
  <rect x="20" y="11" width="24" height="7" rx="3" fill="url(#inv2-box)" filter="url(#inv2-sm)"/>
  <!-- Tape stripe on top box -->
  <rect x="29" y="11" width="5" height="14" rx="0" fill="#d97706" fill-opacity="0.3"/>
  <!-- Box flap details top -->
  <line x1="20" y1="14" x2="44" y2="14" stroke="#d97706" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Shine -->
  <rect x="8" y="38" width="48" height="4" rx="3" fill="white" fill-opacity="0.25"/>
</svg>
