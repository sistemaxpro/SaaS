<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mob-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="mob-screen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="mob-frame" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
    <linearGradient id="mob-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="mob-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0006"/></filter>
    <filter id="mob-sm"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0004"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#mob-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#mob-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#mob-gl)"/>
  <!-- Phone body -->
  <rect x="17" y="6" width="30" height="52" rx="6" fill="url(#mob-frame)" filter="url(#mob-sh)"/>
  <!-- Screen -->
  <rect x="20" y="12" width="24" height="36" rx="3" fill="url(#mob-screen)"/>
  <!-- Screen gloss -->
  <rect x="20" y="12" width="24" height="10" rx="3" fill="white" fill-opacity="0.15"/>
  <!-- Status bar -->
  <rect x="22" y="14" width="10" height="2" rx="1" fill="white" fill-opacity="0.4"/>
  <circle cx="38" cy="15" r="1.5" fill="white" fill-opacity="0.5"/>
  <!-- App icons on screen -->
  <rect x="22" y="20" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.25"/>
  <rect x="30" y="20" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.25"/>
  <rect x="38" y="20" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.25"/>
  <rect x="22" y="28" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.25"/>
  <rect x="30" y="28" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.25"/>
  <rect x="38" y="28" width="6" height="6" rx="1.5" fill="white" fill-opacity="0.25"/>
  <!-- Home indicator -->
  <rect x="27" y="52" width="10" height="2.5" rx="1.25" fill="#94a3b8"/>
  <!-- Camera + notch -->
  <circle cx="32" cy="9" r="2" fill="#1e293b"/>
  <circle cx="32" cy="9" r="1" fill="#475569"/>
  <!-- Side button -->
  <rect x="47" y="20" width="2" height="8" rx="1" fill="#94a3b8" fill-opacity="0.7"/>
</svg>
