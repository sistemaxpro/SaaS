<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="si-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="si-gl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="si-sh"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0003"/></filter>
  </defs>

  <!-- Fondo -->
  <rect width="64" height="64" rx="14" fill="url(#si-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#si-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#si-gl)"/>

  <!-- Cuadrado punteado (placeholder) -->
  <rect x="13" y="13" width="38" height="38" rx="6"
        fill="none" stroke="white" stroke-width="2.5"
        stroke-dasharray="5 3.5" stroke-opacity="0.55"/>

  <!-- Signo de interrogación -->
  <text x="32" y="38"
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="700"
        fill="white" fill-opacity="0.7"
        filter="url(#si-sh)">?</text>
</svg>
