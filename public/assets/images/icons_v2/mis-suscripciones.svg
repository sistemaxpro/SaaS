<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="msu-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#083344"/></linearGradient>
    <linearGradient id="msu-card" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ecfeff"/><stop offset="100%" stop-color="#cffafe"/></linearGradient>
    <linearGradient id="msu-stripe" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="msu-avatar" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="msu-badge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="msu-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="msu-sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0006"/></filter>
    <filter id="msu-sm"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0004"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#msu-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#msu-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#msu-gl)"/>

  <!-- Subscription card (main) -->
  <rect x="8" y="13" width="48" height="30" rx="5" fill="url(#msu-card)" filter="url(#msu-sh)"/>
  <!-- Card color stripe at top -->
  <rect x="8" y="13" width="48" height="9" rx="5" fill="url(#msu-stripe)"/>
  <rect x="8" y="18" width="48" height="4" fill="url(#msu-stripe)"/>
  <!-- Card shine -->
  <rect x="8" y="13" width="48" height="5" rx="5" fill="white" fill-opacity="0.2"/>

  <!-- Avatar circle -->
  <circle cx="20" cy="22" r="7" fill="url(#msu-avatar)" filter="url(#msu-sm)"/>
  <!-- Person silhouette in avatar -->
  <circle cx="20" cy="19.5" r="2.5" fill="white" fill-opacity="0.9"/>
  <path d="M14 27 C14 23 26 23 26 27" fill="white" fill-opacity="0.75"/>

  <!-- Name line -->
  <rect x="30" y="17" width="18" height="3" rx="1.5" fill="white" fill-opacity="0.8"/>
  <!-- Sub-title line -->
  <rect x="30" y="22" width="12" height="2" rx="1" fill="white" fill-opacity="0.5"/>

  <!-- Subscription details section -->
  <!-- Plan label -->
  <rect x="13" y="28" width="10" height="2.5" rx="1" fill="#0891b2" fill-opacity="0.4"/>
  <text x="13" y="36" font-family="Arial,sans-serif" font-size="4" font-weight="700" fill="#0e7490">PLAN</text>
  <text x="24" y="36" font-family="Arial,sans-serif" font-size="4" font-weight="700" fill="#0891b2">PRO</text>

  <!-- Renewal date -->
  <text x="13" y="41" font-family="monospace" font-size="3.5" fill="#64748b">Renov: 01/06/2026</text>

  <!-- Status badge (active checkmark) -->
  <circle cx="50" cy="38" r="5" fill="#22c55e" filter="url(#msu-sm)"/>
  <polyline points="47.5,38 49.5,40 53,36" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Star rating / tier badge at top right of card -->
  <circle cx="50" cy="16" r="6" fill="url(#msu-badge)" filter="url(#msu-sm)"/>
  <polygon points="50,11 51.5,14.5 55,14.5 52.5,16.5 53.5,20 50,18 46.5,20 47.5,16.5 45,14.5 48.5,14.5" fill="white" fill-opacity="0.9"/>

  <!-- Second smaller card behind (stacked) -->
  <rect x="12" y="46" width="40" height="12" rx="4" fill="url(#msu-card)" fill-opacity="0.6" filter="url(#msu-sm)"/>
  <rect x="12" y="46" width="40" height="5" rx="4" fill="url(#msu-stripe)" fill-opacity="0.5"/>
  <!-- Dots on second card -->
  <circle cx="20" cy="54" r="1.5" fill="#0891b2" fill-opacity="0.5"/>
  <rect x="25" y="52" width="18" height="2" rx="1" fill="#0891b2" fill-opacity="0.3"/>
</svg>
