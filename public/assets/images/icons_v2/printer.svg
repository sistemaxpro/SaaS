<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="p-body" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="p-paper" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="p-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="p-sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0005"/></filter>
    <filter id="p-sm"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0003"/></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#p-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#p-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#p-gl)"/>
  <!-- Paper coming out top -->
  <rect x="20" y="8" width="24" height="18" rx="2" fill="url(#p-paper)" filter="url(#p-sm)"/>
  <line x1="24" y1="14" x2="40" y2="14" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24" y1="18" x2="40" y2="18" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24" y1="22" x2="34" y2="22" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Printer body -->
  <rect x="8" y="22" width="48" height="22" rx="5" fill="url(#p-body)" filter="url(#p-sh)"/>
  <!-- Slot line -->
  <rect x="14" y="29" width="36" height="3" rx="1.5" fill="#94a3b8" fill-opacity="0.5"/>
  <!-- Indicator lights -->
  <circle cx="44" cy="36" r="2.5" fill="#4ade80"/>
  <circle cx="50" cy="36" r="2.5" fill="#fbbf24"/>
  <!-- Paper output tray -->
  <rect x="12" y="44" width="40" height="8" rx="3" fill="url(#p-paper)" filter="url(#p-sm)"/>
  <!-- Output paper -->
  <rect x="20" y="42" width="24" height="12" rx="1" fill="white" fill-opacity="0.85"/>
  <!-- Body shine -->
  <rect x="8" y="22" width="48" height="8" rx="5" fill="white" fill-opacity="0.18"/>
  <ellipse cx="32" cy="54" rx="18" ry="2" fill="#0003"/>
</svg>
