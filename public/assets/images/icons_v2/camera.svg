<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cam-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="cam-body" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ede9fe"/><stop offset="100%" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="cam-lens" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0e2e"/></linearGradient>
    <linearGradient id="cam-gl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity="0.3"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="cam-sh"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0005"/></filter>
    <filter id="cam-sm"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0004"/></filter>
    <radialGradient id="cam-lensG" cx="35%" cy="35%"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/><stop offset="100%" stop-color="#1e1b4b"/></radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cam-bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#cam-gl)"/>
  <rect y="18" width="64" height="14" fill="url(#cam-gl)"/>
  <!-- Camera body -->
  <rect x="7" y="20" width="50" height="34" rx="6" fill="url(#cam-body)" filter="url(#cam-sh)"/>
  <!-- Viewfinder bump on top -->
  <rect x="22" y="13" width="18" height="10" rx="4" fill="url(#cam-body)" filter="url(#cam-sm)"/>
  <!-- Shutter button -->
  <circle cx="47" cy="18" r="5" fill="#c4b5fd" filter="url(#cam-sm)"/>
  <circle cx="47" cy="18" r="3" fill="#7c3aed"/>
  <!-- Body shine -->
  <rect x="7" y="20" width="50" height="10" rx="6" fill="white" fill-opacity="0.2"/>
  <!-- Lens outer ring -->
  <circle cx="30" cy="37" r="13" fill="#7c3aed" fill-opacity="0.3" filter="url(#cam-sh)"/>
  <!-- Lens body -->
  <circle cx="30" cy="37" r="11" fill="url(#cam-lens)"/>
  <!-- Lens rings -->
  <circle cx="30" cy="37" r="9" fill="none" stroke="#4c1d95" stroke-width="1.2"/>
  <circle cx="30" cy="37" r="6" fill="none" stroke="#4c1d95" stroke-width="1"/>
  <!-- Lens glass -->
  <circle cx="30" cy="37" r="5" fill="url(#cam-lensG)"/>
  <!-- Lens reflection -->
  <ellipse cx="27.5" cy="34" rx="2.5" ry="1.5" fill="white" fill-opacity="0.3" transform="rotate(-20 27.5 34)"/>
  <!-- Flash indicator -->
  <rect x="46" y="26" width="6" height="4" rx="2" fill="#fbbf24" fill-opacity="0.85"/>
</svg>
