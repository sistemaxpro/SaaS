<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <defs>
    <!-- Gradiente principal azul -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    
    <!-- Gradiente para el icono -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    
    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e40af" flood-opacity="0.3"/>
    </filter>
    
    <!-- Brillo glassmorphism -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:white;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Icono: Cubo/Sistema con efecto 3D -->
  <g filter="url(#shadow)">
    <!-- Base del cubo -->
    <path d="M35 15 L60 5 L60 45 L35 55 L10 45 L10 5 Z" fill="url(#iconGradient)"/>
    
    <!-- Cara frontal izquierda -->
    <path d="M10 5 L35 15 L35 55 L10 45 Z" fill="#2563eb"/>
    
    <!-- Cara frontal derecha -->
    <path d="M35 15 L60 5 L60 45 L35 55 Z" fill="#3b82f6"/>
    
    <!-- Cara superior -->
    <path d="M10 5 L35 15 L60 5 L35 -5 Z" fill="#60a5fa"/>
    
    <!-- Líneas internas del sistema -->
    <path d="M20 12 L35 19 L50 12" stroke="white" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M35 19 L35 35" stroke="white" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="35" cy="19" r="2" fill="white" opacity="0.8"/>
    <circle cx="20" cy="12" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="50" cy="12" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="35" cy="35" r="1.5" fill="white" opacity="0.6"/>
    
    <!-- Brillo superior -->
    <path d="M10 5 L35 15 L60 5 L35 -5 Z" fill="url(#glassShine)"/>
  </g>
  
  <!-- Texto "Sistema" -->
  <text x="75" y="38" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="600" fill="url(#blueGradient)">
    Sistema
  </text>
  
  <!-- Texto "X" destacado -->
  <text x="202" y="38" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="700" fill="#1d4ed8">
    X
  </text>
  
  <!-- Badge "Pro" -->
  <g>
    <rect x="222" y="18" width="32" height="18" rx="9" fill="url(#iconGradient)"/>
    <text x="238" y="31" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">
      Pro
    </text>
  </g>
  
  <!-- Línea decorativa inferior -->
  <rect x="75" y="48" width="180" height="2" rx="1" fill="url(#blueGradient)" opacity="0.3"/>
</svg>
