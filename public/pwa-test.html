<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWA Test - SistemaX</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
        background: #1a1a2e;
        color: #eee;
        line-height: 1.6;
      }
      h1 {
        color: #3b82f6;
      }
      .check {
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
        background: #16213e;
      }
      .pass {
        border-left: 4px solid #22c55e;
      }
      .fail {
        border-left: 4px solid #ef4444;
      }
      .warn {
        border-left: 4px solid #f59e0b;
      }
      .status {
        font-weight: bold;
      }
      .pass .status {
        color: #22c55e;
      }
      .fail .status {
        color: #ef4444;
      }
      .warn .status {
        color: #f59e0b;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin: 10px 0;
      }
      button:hover {
        background: #2563eb;
      }
      pre {
        background: #0f0f23;
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
        font-size: 12px;
      }
      #installBtn {
        background: #22c55e;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>🔍 Diagnóstico PWA - SistemaX</h1>

    <div id="checks"></div>

    <button id="installBtn" onclick="installPWA()">
      📲 Instalar App Ahora
    </button>

    <h2>📋 Información del Navegador</h2>
    <pre id="browserInfo"></pre>

    <h2>📄 Contenido del Manifest</h2>
    <pre id="manifestContent">Cargando...</pre>

    <script>
      const checks = document.getElementById("checks");
      let deferredPrompt = null;

      function addCheck(title, status, message) {
        const div = document.createElement("div");
        div.className = `check ${status}`;
        div.innerHTML = `<span class="status">${status === "pass" ? "✅" : status === "fail" ? "❌" : "⚠️"} ${title}</span><br>${message}`;
        checks.appendChild(div);
      }

      // 1. Verificar HTTPS
      if (location.protocol === "https:") {
        addCheck("HTTPS", "pass", "El sitio está en HTTPS");
      } else {
        addCheck(
          "HTTPS",
          "fail",
          `El sitio está en ${location.protocol} - ¡DEBE ser HTTPS para PWA!`,
        );
      }

      // 2. Verificar Service Worker
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistration().then((reg) => {
          if (reg) {
            addCheck("Service Worker", "pass", `Registrado en: ${reg.scope}`);
          } else {
            addCheck(
              "Service Worker",
              "fail",
              "No hay Service Worker registrado",
            );
            // Intentar registrar
            navigator.serviceWorker
              .register("sw.js")
              .then((r) => {
                console.log("SW registrado:", r);
              })
              .catch((e) => {
                console.error("Error registrando SW:", e);
              });
          }
        });
      } else {
        addCheck(
          "Service Worker",
          "fail",
          "El navegador no soporta Service Workers",
        );
      }

      // 3. Verificar Manifest
      fetch("manifest.json")
        .then((r) => r.json())
        .then((manifest) => {
          document.getElementById("manifestContent").textContent =
            JSON.stringify(manifest, null, 2);

          // Verificar campos requeridos
          const hasName = !!manifest.name;
          const hasIcons = manifest.icons && manifest.icons.length > 0;
          const hasStartUrl = !!manifest.start_url;
          const hasDisplay = !!manifest.display;

          if (hasName && hasIcons && hasStartUrl && hasDisplay) {
            addCheck(
              "Manifest",
              "pass",
              "Manifest válido con todos los campos requeridos",
            );
          } else {
            let missing = [];
            if (!hasName) missing.push("name");
            if (!hasIcons) missing.push("icons");
            if (!hasStartUrl) missing.push("start_url");
            if (!hasDisplay) missing.push("display");
            addCheck(
              "Manifest",
              "fail",
              `Faltan campos: ${missing.join(", ")}`,
            );
          }

          // Verificar iconos
          const icon192 = manifest.icons?.find((i) => i.sizes?.includes("192"));
          const icon512 = manifest.icons?.find((i) => i.sizes?.includes("512"));

          if (icon192 && icon512) {
            addCheck("Iconos", "pass", "Tiene iconos de 192x192 y 512x512");
          } else {
            addCheck(
              "Iconos",
              "warn",
              "Faltan iconos de tamaño exacto 192x192 o 512x512",
            );
          }
        })
        .catch((err) => {
          document.getElementById("manifestContent").textContent =
            "Error: " + err.message;
          addCheck(
            "Manifest",
            "fail",
            "No se pudo cargar el manifest: " + err.message,
          );
        });

      // 4. Verificar modo standalone
      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
      if (isStandalone) {
        addCheck("Modo PWA", "pass", "¡Ya está ejecutando como PWA instalada!");
      } else {
        addCheck("Modo PWA", "warn", "Ejecutando en navegador (no instalada)");
      }

      // 5. Verificar beforeinstallprompt
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById("installBtn").style.display = "block";
        addCheck(
          "Install Prompt",
          "pass",
          "¡El navegador permite instalación! Toca el botón verde.",
        );
      });

      setTimeout(() => {
        if (!deferredPrompt) {
          addCheck(
            "Install Prompt",
            "warn",
            "El navegador no disparó el evento de instalación. Posibles razones:<br>" +
              "• Ya está instalada<br>" +
              "• El navegador no soporta PWA (Safari iOS)<br>" +
              "• Falta HTTPS<br>" +
              "• Debes visitar la página varias veces",
          );
        }
      }, 3000);

      // Info del navegador
      document.getElementById("browserInfo").textContent =
        `URL: ${location.href}\n` +
        `Protocolo: ${location.protocol}\n` +
        `User Agent: ${navigator.userAgent}\n` +
        `Standalone: ${isStandalone}\n` +
        `Service Worker soportado: ${"serviceWorker" in navigator}`;

      // Función para instalar
      async function installPWA() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const result = await deferredPrompt.userChoice;
          alert("Resultado: " + result.outcome);
          deferredPrompt = null;
        } else {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          if (isIOS) {
            alert(
              '📱 En iPhone/iPad:\n\n1. Abre esta página en Safari\n2. Toca el botón Compartir (📤)\n3. Toca "Añadir a pantalla de inicio"',
            );
          } else {
            alert(
              '📱 En Android Chrome:\n\n1. Toca el menú (⋮)\n2. Busca "Instalar aplicación" o "Añadir a pantalla de inicio"\n\n⚠️ Si no aparece, asegúrate de estar en HTTPS',
            );
          }
        }
      }
    </script>
  </body>
</html>
